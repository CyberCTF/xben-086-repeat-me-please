# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-086-24 Repeat Me Please (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Ruby (Sinatra) page that repeats the user's input back, behind validation checks.
# The benchmark folder benchmarks/XBEN-086-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/app/app/, built by its own Dockerfiles; the overlay in build/app/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-086-repeat-me-please

networks:
  lab: { cidr: 10.61.129.0/24, internet: false }

machines:
  app:
    networks: { lab: 10 }
    services: [{ port: 4567, name: web, http: true, publish: 4567 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/app

checks:
  - name: the Repeat Me Please page answers
    http: http://app:4567/
    wait: 180
  - name: the page repeats a sentence
    script: checks/probe.sh
    wait: 60

message: |
  Repeat Me Please answers at http://localhost:{{ machines.app.services.0.publish }}/.
  The page repeats what you type, after some validation. Be careful what you ask it to repeat.
